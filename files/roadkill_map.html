<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>臺灣鼬獾路殺點位地圖</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <!-- Marker Cluster -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  >

  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js">
  </script>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    #application {
      display: grid;
      grid-template-columns: 42% 58%;
      width: 100%;
      height: 100vh;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #detail-panel {
      overflow-y: auto;
      padding: 22px;
      box-sizing: border-box;
      background: #fff;
      border-left: 1px solid #ddd;
    }

    #placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
      text-align: center;
    }

    #point-content {
      display: none;
    }

    #point-title {
      margin-top: 0;
    }

    .information {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .information-item {
      padding: 12px;
      border-radius: 7px;
      background: #f4f6f8;
    }

    .label {
      color: #666;
      font-size: 0.85rem;
    }

    .value {
      margin-top: 4px;
      font-weight: 600;
    }

    #street-chart {
      width: 100%;
      min-height: 570px;
    }

    .source-link {
      display: inline-block;
      padding: 8px 12px;
      color: white;
      background: #2c7fb8;
      border-radius: 5px;
      text-decoration: none;
    }

    @media (max-width: 800px) {
      html,
      body {
        overflow: auto;
      }

      #application {
        display: block;
        height: auto;
      }

      #map {
        height: 55vh;
      }

      #detail-panel {
        min-height: 45vh;
        border-left: none;
        border-top: 1px solid #ddd;
      }

    }
  </style>
</head>

<body>

  <div id="application">

    <div id="map"></div>

    <aside id="detail-panel">

      <div id="placeholder">
        <div>
          <h2>臺灣鼬獾研究點位</h2>
          <p>請點擊地圖上的標記查看點位及環境資訊。</p>
        </div>
      </div>

      <div id="point-content">

        <h1 id="point-title"></h1>

        <h2>點位資訊</h2>

        <div class="information">

          <div class="information-item">
            <div class="label">點位編號</div>
            <div class="value" id="info-id"></div>
          </div>

          <div class="information-item">
            <div class="label">資料類型</div>
            <div class="value" id="info-type"></div>
          </div>

          <div class="information-item">
            <div class="label">緯度</div>
            <div class="value" id="info-lat"></div>
          </div>

          <div class="information-item">
            <div class="label">經度</div>
            <div class="value" id="info-lon"></div>
          </div>

          <div class="information-item">
            <div class="label">道路類型</div>
            <div class="value" id="info-highway"></div>
          </div>

          <div class="information-item">
            <div class="label">距最近水系</div>
            <div class="value" id="info-water"></div>
          </div>

        </div>

        <a
          id="tairon-link"
          class="source-link"
          target="_blank"
        >
          查看 TaiRON 原始紀錄
        </a>

        <h2>四方位街景平均環境特徵</h2>

        <div id="street-chart"></div>

      </div>

    </aside>

  </div>

  <script>
    const streetVariables = [
      "Curb",
      "Fence",
      "Guard_Rail",
      "Barrier",
      "Wall",
      "Bike_Lane",
      "Parking",
      "Pedestrian_Area",
      "Rail_Track",
      "Sidewalk",
      "Bridge",
      "Building",
      "Tunnel",
      "Mountain",
      "Sand",
      "Terrain",
      "Vegetation",
      "Water",
      "Street_Light",
      "Pole",
      "Traffic_Sign_Frame",
      "Traffic_Light",
      "Road",
      "Sky"
    ];

    const streetLabels = [
      "路緣",
      "圍籬",
      "護欄",
      "障礙物",
      "牆面",
      "自行車道",
      "停車區",
      "行人區",
      "鐵道",
      "人行道",
      "橋",
      "建物",
      "隧道",
      "山地",
      "沙地",
      "地形",
      "植被",
      "水域",
      "路燈",
      "電桿／柱",
      "號誌框",
      "交通號誌",
      "道路",
      "天空"
    ];

    const map = L.map("map").setView(
      [23.7, 121.0],
      8
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }
    ).addTo(map);

    const markerCluster = L.markerClusterGroup();

    map.addLayer(markerCluster);

    async function loadPoints() {
      try {
        const response = await fetch("data/points.json");

        if (!response.ok) {
          throw new Error("無法讀取 points.json");
        }

        const points = await response.json();
        const bounds = [];

        points.forEach(point => {
          const latitude = Number(point.Lat);
          const longitude = Number(point.Lon);

          if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
          ) {
            return;
          }

          const marker = L.marker([
            latitude,
            longitude
          ]);

          marker.bindTooltip(
            `點位 ${point.id}`
          );

          marker.on("click", () => {
            showPoint(point);
          });

          markerCluster.addLayer(marker);

          bounds.push([
            latitude,
            longitude
          ]);
        });

        if (bounds.length > 0) {
          map.fitBounds(
            bounds,
            {
              padding: [20, 20]
            }
          );
        }

      } catch (error) {
        document.getElementById(
          "placeholder"
        ).innerHTML = `
          <div>
            <h2>資料載入失敗</h2>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    function showPoint(point) {
      document.getElementById(
        "placeholder"
      ).style.display = "none";

      document.getElementById(
        "point-content"
      ).style.display = "block";

      document.getElementById(
        "point-title"
      ).textContent = `點位 ${point.id}`;

      document.getElementById(
        "info-id"
      ).textContent = point.id ?? "無資料";

      document.getElementById(
        "info-type"
      ).textContent = point.data_type == "roadkill" ? '路殺資料' : "偽失點資料";

      document.getElementById(
        "info-lat"
      ).textContent = Number(point.Lat).toFixed(6);

      document.getElementById(
        "info-lon"
      ).textContent = Number(point.Lon).toFixed(6);

      document.getElementById(
        "info-highway"
      ).textContent = point.highway_type ?? "無資料";

      const waterDistance =
        Number(point.water_nearest_dis);

      document.getElementById(
        "info-water"
      ).textContent =
        Number.isFinite(waterDistance)
          ? `${waterDistance.toFixed(1)} m`
          : "無資料";

      const taironLink =
        document.getElementById("tairon-link");

      if (point.taiRON_url) {
        taironLink.href = point.taiRON_url;
        taironLink.style.display = "inline-block";
      } else {
        taironLink.style.display = "none";
      }

      showChart(point);

      document.getElementById(
        "detail-panel"
      ).scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function showChart(point) {
      const values = streetVariables.map(variable => {
        const value = Number(point[variable]);
        return Number.isFinite(value) ? value : 0;
      });

      Plotly.react(
        "street-chart",
        [{
          type: "bar",
          orientation: "h",
          x: values,
          y: streetLabels,
          marker: {
            color: "#3b82a0"
          },

          texttemplate: "%{x:.1f%}",
          textposition: "outside",
          cliponaxis: false,

          hovertemplate:
            "%{y}<br>比例：%{x:.1f%}<extra></extra>"
        }],
        {
          xaxis: {
            title: "平均像素比例（%）",
            ticksuffix: "%"
          },

          yaxis: {
            autorange: "reversed",
            automargin: true
          },

          margin: {
            left: 115,
            right: 65,
            top: 20,
            bottom: 60
          }
        },
        {
          responsive: true,
          displaylogo: false
        }
      );
    }

    loadPoints();
  </script>

</body>
</html>
